name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main  # Change this to master if your default branch is master

env:
  AZURE_WEBAPP_NAME: 'mernstackPOC'   # Target Azure Web App name
  NODE_VERSION: '22' 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub Action
      uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
      working-directory: ./backend # Tells GitHub to look inside your backend folder

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'mernstackPOC'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './backend'
